plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
    id 'portability-gametest'
}
def functionalSuite = portabilityGameTestSuites.functional
def mixinCompatibilitySuite = portabilityGameTestSuites.mixinCompatibility
sourceSets { gametest }
base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }

        server {
            server()
            gameDirectory = file('runs/server')
            programArgument "--mixin.config=${mod_id}.mixins.json"
            programArgument "--mixin.config=${mod_id}.forge.mixins.json"
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('portability-gametest-run').get().asFile
            programArgument "--mixin.config=${mod_id}.mixins.json"
            programArgument "--mixin.config=${mod_id}.forge.mixins.json"
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            sourceSet = sourceSets.gametest
        }

        functionalGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('functional-gametest-run').get().asFile
            programArgument "--mixin.config=${mod_id}.mixins.json"
            programArgument "--mixin.config=${mod_id}.forge.mixins.json"
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            sourceSet = sourceSets.gametest
        }

        mixinCompatibilityGameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('mixin-compatibility-gametest-run').get().asFile
            programArgument "--mixin.config=${mod_id}.mixins.json"
            programArgument "--mixin.config=${mod_id}.forge.mixins.json"
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            sourceSet = sourceSets.gametest
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_portability_test" {
            sourceSet sourceSets.gametest
        }
    }
}
def portabilityRunTaskName = 'runGameTestServer'
configurePortabilityGameTestSourceSet(sourceSets.gametest)
configurePortabilityGameTestRun(sourceSets.gametest, portabilityRunTaskName,
        functionalSuite.id, null)
def functionalRunTaskName = 'runFunctionalGameTestServer'
configurePortabilityGameTestRun(sourceSets.gametest, functionalRunTaskName,
        functionalSuite.id, 'Functional')
def mixinCompatibilityRunTaskName = 'runMixinCompatibilityGameTestServer'
configurePortabilityGameTestRun(sourceSets.gametest, mixinCompatibilityRunTaskName,
        mixinCompatibilitySuite.id, 'MixinCompatibility')

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    jarJar(implementation("io.github.llamalad7:mixinextras-forge:0.5.5")) {
        version {
            strictly "[0.5.5,)"
        }
    }

    additionalRuntimeClasspath "org.greenrobot:eventbus-java:3.3.1"
    jarJar(implementation("org.greenrobot:eventbus-java")) {
        version {
            strictly "[3.3,4.0)"
            prefer "3.3.1"
        }
    }
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}
