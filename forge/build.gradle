plugins {
    id 'multiloader-loader'
    id 'portability-gametest'
    id 'net.minecraftforge.gradle' version '6.0.46'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
def functionalSuite = portabilityGameTestSuites.functional
def mixinCompatibilitySuite = portabilityGameTestSuites.mixinCompatibility
sourceSets { gametest }
base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

jarJar.enable()

mixin {
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}
jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    // Forge still uses SRG names during compile time, so we cannot use the common AT's
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory layout.buildDirectory.dir('portability-gametest-run').get().asFile
            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"
            property 'forge.enabledGameTestNamespaces', portabilityGameTestNamespace(functionalSuite)

            mods {
                modGameTestRun {
                    source sourceSets.main
                }
                compatibilityTestRun {
                    source sourceSets.gametest
                }
            }
        }

        functionalGameTestServer {
            parent gameTestServer
            main 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--launchTarget', 'forge_userdev_server_gametest'
            workingDirectory layout.buildDirectory.dir('functional-gametest-run').get().asFile
            property 'forge.enabledGameTestNamespaces', portabilityGameTestNamespace(functionalSuite)
        }

        mixinCompatibilityGameTestServer {
            parent gameTestServer
            workingDirectory layout.buildDirectory.dir('mixin-compatibility-gametest-run').get().asFile
            property 'forge.enabledGameTestNamespaces', portabilityGameTestNamespace(mixinCompatibilitySuite)
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}
def portabilityRunTaskName = 'runGameTestServer'
configurePortabilityGameTestSourceSet(sourceSets.gametest)
configurePortabilityGameTestRun(sourceSets.gametest, portabilityRunTaskName,
        functionalSuite.id, null)
def functionalRunTaskName = 'runFunctionalGameTestServer'
configurePortabilityGameTestRun(sourceSets.gametest, functionalRunTaskName,
        functionalSuite.id, 'Functional')
def mixinCompatibilityRunTaskName = 'runMixinCompatibilityGameTestServer'
configurePortabilityGameTestRun(sourceSets.gametest, mixinCompatibilityRunTaskName,
        mixinCompatibilitySuite.id, 'MixinCompatibility')

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.5')) {
        jarJar.ranged(it, '[0.5.5,)')
    }

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
    
    minecraftLibrary "org.greenrobot:eventbus-java:3.3.1"

    jarJar("org.greenrobot:eventbus-java:[3.3,4.0)") {
        jarJar.pin(it, "3.3.1")
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
