plugins {
    id 'multiloader-loader'
    id 'portability-gametest'
    id 'net.minecraftforge.gradle' version '7.0.36'
    id 'net.minecraftforge.jarjar' version '0.2.3'
    id 'idea'
}
def functionalSuite = portabilityGameTestSuites.functional
def mixinCompatibilitySuite = portabilityGameTestSuites.mixinCompatibility
sourceSets { gametest }
base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

jarJar.register() {
    archiveClassifier = null
}

jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

processResources {
    // Forge 65 embeds upstream Mixin 0.8.7, whose highest recognised level is JAVA_21.
    filesMatching("${mod_id}.mixins.json") {
        filter { line -> line.replace('"compatibilityLevel": "JAVA_25"', '"compatibilityLevel": "JAVA_21"') }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDir = file('runs/client')
            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"

            mods {
                modClientRun {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }

        server {
            workingDir = file('runs/server')
            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"

            mods {
                modServerRun {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDir = layout.buildDirectory.dir('portability-gametest-run').get().asFile
            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"
            args '--tests', "${portabilityGameTestNamespace(functionalSuite)}:*"

            mods {
                modGameTestRun {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
                compatibilityTestRun {
                    source sourceSets.gametest
                }
            }
        }

        functionalGameTestServer {
            workingDir = layout.buildDirectory.dir('functional-gametest-run').get().asFile
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--launchTarget', 'forge_userdev_server_gametest'
            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"
            args '--tests', "${portabilityGameTestNamespace(functionalSuite)}:*"

            mods {
                modGameTestRun {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
                functionalTestRun {
                    source sourceSets.gametest
                }
            }
        }

        mixinCompatibilityGameTestServer {
            workingDir = layout.buildDirectory.dir('mixin-compatibility-gametest-run').get().asFile
            mainClass = 'net.minecraftforge.bootstrap.ForgeBootstrap'
            args '--launchTarget', 'forge_userdev_server_gametest'
            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"
            args '--tests', "${portabilityGameTestNamespace(mixinCompatibilitySuite)}:*"

            mods {
                modGameTestRun {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
                compatibilityTestRun {
                    source sourceSets.gametest
                }
            }
        }

        data {
            workingDir = file('runs/data')
            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                modDataRun {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }
    }
}
def portabilityRunTaskName = sourceSets.gametest.getTaskName('run', minecraft.runs.gameTestServer.name)
configurePortabilityGameTestSourceSet(sourceSets.gametest)
configurePortabilityGameTestRun(sourceSets.gametest, portabilityRunTaskName,
        functionalSuite.id, null)
def functionalRunTaskName = sourceSets.gametest.getTaskName('run', minecraft.runs.functionalGameTestServer.name)
configurePortabilityGameTestRun(sourceSets.gametest, functionalRunTaskName,
        functionalSuite.id, 'Functional')
def mixinCompatibilityRunTaskName = sourceSets.gametest.getTaskName('run', minecraft.runs.mixinCompatibilityGameTestServer.name)
configurePortabilityGameTestRun(sourceSets.gametest, mixinCompatibilityRunTaskName,
        mixinCompatibilitySuite.id, 'MixinCompatibility')

def generatedGameTestResources = layout.buildDirectory.dir('generated/portabilityGameTestResources')
def generatePortabilityGameTestInstances = tasks.register('generatePortabilityGameTestInstances', JavaExec) {
    group = 'build setup'
    description = 'Generates Forge test-instance JSON from the canonical portability scenarios.'
    dependsOn tasks.named('compileGametestJava')
    classpath = files(tasks.named('compileGametestJava', JavaCompile).flatMap { it.destinationDirectory },
            project(':common').file('src/gametest/resources'),
            sourceSets.gametest.compileClasspath)
    mainClass = 'com.tik.zbb.gametest.forge.ForgeGameTestGenerator'
    args generatedGameTestResources.get().asFile.absolutePath
    outputs.dir generatedGameTestResources
}

sourceSets.gametest.resources.srcDir generatedGameTestResources
tasks.named(sourceSets.gametest.processResourcesTaskName) { dependsOn generatePortabilityGameTestInstances }

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    minecraft.mavenizer(it)
    maven { url = uri(layout.projectDirectory.dir('../.gradle/mavenizer/repo')) }
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'

    implementation "org.greenrobot:eventbus-java:3.3.1"
    jarJar "org.greenrobot:eventbus-java:3.3.1"
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}
