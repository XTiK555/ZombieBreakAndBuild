plugins {
    id 'multiloader-loader'
    id 'portability-gametest'
    id 'net.neoforged.moddev'
}

def functionalSuite = portabilityGameTestSuites.functional
def mixinCompatibilitySuite = portabilityGameTestSuites.mixinCompatibility

sourceSets { gametest }

neoForge {
    version = neoforge_version
    addModdingDependenciesTo sourceSets.gametest

    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        portabilityGameTest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }

        client {
            client()
            loadedMods = [mods."${mod_id}"]
            gameDirectory = this.mkdir(this.file("runs/client"))
        }

        data {
            clientData()
            loadedMods = [mods."${mod_id}"]
            gameDirectory = this.mkdir(this.file("runs/data"))
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        server {
            server()
            loadedMods = [mods."${mod_id}"]
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }

        functionalGameTest {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${mod_id}", mods.portabilityGameTest]
            systemProperty('neoforge.enabledGameTestNamespaces', portabilityGameTestNamespace(functionalSuite))
            gameDirectory = layout.buildDirectory.dir('functional-gametest-run').get().asFile
        }

        mixinCompatibilityGameTest {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${mod_id}", mods.portabilityGameTest]
            systemProperty('neoforge.enabledGameTestNamespaces', portabilityGameTestNamespace(mixinCompatibilitySuite))
            gameDirectory = layout.buildDirectory.dir('mixin-compatibility-gametest-run').get().asFile
        }
    }
}

configurePortabilityGameTestSourceSet(sourceSets.gametest)
configurePortabilityGameTestRun(sourceSets.gametest, tasks.named('runFunctionalGameTest', JavaExec),
        functionalSuite.id, 'Functional')
configurePortabilityGameTestRun(sourceSets.gametest, tasks.named('runMixinCompatibilityGameTest', JavaExec),
        mixinCompatibilitySuite.id, 'MixinCompatibility')

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    jarJar(implementation("org.greenrobot:eventbus-java")) {
        version {
            strictly "[3.3,4.0)"
            prefer "3.3.1"
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
