plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

tasks.register('mixinCompatibilityTest') {
    group = 'verification'
    description = 'Runs the behavioral mixin compatibility GameTests on Fabric, Forge, and NeoForge.'
    dependsOn ':fabric:verifyMixinCompatibilityGameTest', ':forge:verifyMixinCompatibilityGameTest', ':neoforge:verifyMixinCompatibilityGameTest'
}
