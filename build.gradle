plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

tasks.register('portabilityCheck') {
    group = 'verification'
    description = 'Runs unit tests and all portability GameTests on Fabric, Forge, and NeoForge.'
    dependsOn ':common:test', ':fabric:verifyPortabilityGameTest', ':forge:verifyPortabilityGameTest', ':neoforge:verifyPortabilityGameTest'
}

tasks.register('functionalGameTest') {
    group = 'verification'
    description = 'Runs the quick functional regression check on all supported loaders.'
    dependsOn ':common:test', ':fabric:verifyFunctionalGameTest', ':forge:verifyFunctionalGameTest', ':neoforge:verifyFunctionalGameTest'
}

tasks.register('mixinCompatibilityGameTest') {
    group = 'verification'
    description = 'Runs the focused mixin compatibility GameTests on every supported loader.'
    dependsOn ':fabric:verifyMixinCompatibilityGameTest', ':forge:verifyMixinCompatibilityGameTest', ':neoforge:verifyMixinCompatibilityGameTest'
}
