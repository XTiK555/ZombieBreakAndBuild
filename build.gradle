plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
}

tasks.register('mixinCompatibilityTest') {
    group = 'verification'
    description = 'Runs the behavioral mixin compatibility GameTests on Fabric and Forge.'
    dependsOn ':fabric:verifyMixinCompatibilityGameTest', ':forge:verifyMixinCompatibilityGameTest'
}
