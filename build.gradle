plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
}

tasks.register('portabilityCheck') {
    group = 'verification'
    description = 'Runs unit tests and all portability GameTests on Fabric and Forge.'
    dependsOn ':common:test', ':fabric:verifyPortabilityGameTest', ':forge:verifyPortabilityGameTest'
}

tasks.register('functionalGameTest') {
    group = 'verification'
    description = 'Runs the quick functional regression check on Fabric and Forge.'
    dependsOn ':common:test', ':fabric:verifyFunctionalGameTest', ':forge:verifyFunctionalGameTest'
}

tasks.register('mixinCompatibilityGameTest') {
    group = 'verification'
    description = 'Runs the focused mixin compatibility GameTests on Fabric and Forge.'
    dependsOn ':fabric:verifyMixinCompatibilityGameTest', ':forge:verifyMixinCompatibilityGameTest'
}
