plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'portability-gametest'
}
sourceSets { gametest }

def functionalSuite = portabilityGameTestSuites.functional
def mixinCompatibilitySuite = portabilityGameTestSuites.mixinCompatibility
def portabilityTestModId = "${mod_id}_portability_test"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")

    implementation "com.electronwill.night-config:toml:3.8.3"
    implementation "com.electronwill.night-config:core:3.8.3"
    include "com.electronwill.night-config:toml:3.8.3"
    include "com.electronwill.night-config:core:3.8.3"

    implementation "org.greenrobot:eventbus-java:3.3.1"
    include "org.greenrobot:eventbus-java:3.3.1"
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${portabilityTestModId}" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTest {
            server()
            setConfigName("Fabric Game Test")
            ideConfigGenerated(true)
            source sourceSets.main
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('fabric-gametest.xml').get().asFile.absolutePath}"
            runDir("build/run/gameTest")
        }
        functionalGameTest {
            inherit gameTest
            setConfigName('Fabric Functional GameTests')
            runDir('build/run/functionalGameTest')
        }
        mixinCompatibilityGameTest {
            inherit gameTest
            setConfigName('Fabric Mixin Compatibility GameTests')
            runDir('build/run/mixinCompatibilityGameTest')
        }
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

def generatedAdapterSource = layout.buildDirectory.file('generated/portabilityFabricAdapter/com/tik/zbb/gametest/FabricPortabilityGameTests.java')
def generatedTestEnvironments = layout.buildDirectory.dir('generated/portabilityGameTestEnvironments')
def generatedAdapterClasses = layout.buildDirectory.dir('classes/java/portabilityFabricAdapter')
def generateFabricPortabilityAdapter = tasks.register('generateFabricPortabilityAdapter', JavaExec) {
    dependsOn tasks.named('compileGametestJava')
    classpath = files(tasks.named('compileGametestJava', JavaCompile).flatMap { it.destinationDirectory },
            project(':common').file('src/gametest/resources'),
            sourceSets.gametest.compileClasspath)
    mainClass = 'com.tik.zbb.gametest.fabric.FabricGameTestGenerator'
    args generatedAdapterSource.get().asFile.absolutePath, generatedTestEnvironments.get().asFile.absolutePath
    outputs.file generatedAdapterSource
    outputs.dir generatedTestEnvironments
}
def compileFabricPortabilityAdapter = tasks.register('compileFabricPortabilityAdapter', JavaCompile) {
    dependsOn generateFabricPortabilityAdapter
    source generatedAdapterSource
    classpath = files(tasks.named('compileGametestJava', JavaCompile).flatMap { it.destinationDirectory },
            sourceSets.gametest.compileClasspath)
    destinationDirectory = generatedAdapterClasses
    javaCompiler = tasks.named('compileGametestJava', JavaCompile).flatMap { it.javaCompiler }
    group = 'build setup'
    description = 'Compiles the generated Fabric portability GameTest adapter.'
}
sourceSets.gametest.output.classesDirs.from(
        compileFabricPortabilityAdapter.flatMap { it.destinationDirectory }
)
tasks.named(sourceSets.gametest.classesTaskName) { dependsOn compileFabricPortabilityAdapter }
sourceSets.gametest.resources.srcDir generatedTestEnvironments
tasks.named(sourceSets.gametest.processResourcesTaskName) { dependsOn generateFabricPortabilityAdapter }

generateFabricPortabilityAdapter.configure {
    group = 'build setup'
    description = 'Generates the Fabric adapter for the canonical portability scenarios.'
}
configurePortabilityGameTestSourceSet(sourceSets.gametest)
configurePortabilityGameTestRun(sourceSets.gametest, tasks.named('runGameTest', JavaExec),
        functionalSuite.id, null)
configurePortabilityGameTestRun(sourceSets.gametest, tasks.named('runFunctionalGameTest', JavaExec),
        functionalSuite.id, 'Functional')
configurePortabilityGameTestRun(sourceSets.gametest, tasks.named('runMixinCompatibilityGameTest', JavaExec),
        mixinCompatibilitySuite.id, 'MixinCompatibility')

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
