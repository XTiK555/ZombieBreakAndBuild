plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "com.electronwill.night-config:toml:3.8.3"
    implementation "com.electronwill.night-config:core:3.8.3"
    include "com.electronwill.night-config:toml:3.8.3"
    include "com.electronwill.night-config:core:3.8.3"

    implementation "org.greenrobot:eventbus-java:3.3.1"
    include "org.greenrobot:eventbus-java:3.3.1"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'zbb_compatibility_test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

apply from: rootProject.file('common/mixin-compatibility.gradle')
configureMixinCompatibilitySourceSet(sourceSets.gametest)

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

cleanMixinCompatibilityRun('runGameTest', layout.buildDirectory.dir('run/gameTest'))
registerMixinCompatibilityVerification('runGameTest', sourceSets.gametest,
        layout.buildDirectory.file('reports/mixin-compatibility-gametest.xml'))

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
